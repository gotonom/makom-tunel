<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>MAKOM OG kartı</title>
<!-- 1200×630 share cards built around each panel's live process diagram.
     Variant from the hash: #index, #bunker, #tunel, #oda. The diagrams are the real pages loaded in
     same-origin iframes, so this file must be served over HTTP from the repo root: python3 og/render.py -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=block">
<style>
:root{
  --ink:#ffffff; --ink-2:#c9d7f2; --muted:#8fa5cf; --cyan:#7dd3fc; --line:rgba(255,255,255,.16);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-ui:"Barlow Semi Condensed",Arial,sans-serif; --f-mono:"IBM Plex Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;color:var(--ink);font-family:var(--f-ui);
  background:
    radial-gradient(900px 520px at 88% 8%, rgba(56,189,248,.30), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(167,139,250,.22), transparent 60%),
    linear-gradient(160deg,#0b2a6b 0%,#071a45 55%,#050f2b 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:40px 40px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#fbbf24,#f43f5e 30%,#a78bfa 50%,#34d399 72%,#38bdf8)}
.top{position:absolute;left:60px;right:60px;top:46px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.brand b{font:800 28px var(--f-display);letter-spacing:.16em}
.brand span{font:600 14px var(--f-mono);letter-spacing:.14em;color:var(--cyan);margin-left:6px;padding-left:16px;border-left:1px solid var(--line)}
.live{display:flex;align-items:center;gap:10px;font:600 14px var(--f-mono);letter-spacing:.14em;color:#86efac;padding:8px 14px;border-radius:999px;background:rgba(34,197,94,.10);border:1px solid rgba(134,239,172,.35)}
.live i{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}
.head{position:absolute;left:60px;top:118px;right:60px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
h1{font:800 92px/.9 var(--f-display);letter-spacing:.005em;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.35)}
h1 span{background:linear-gradient(90deg,#7dd3fc,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font:500 23px/1.3 var(--f-ui);color:var(--ink-2);max-width:470px;text-align:right;padding-bottom:6px}
.foot{position:absolute;left:60px;bottom:26px;font:600 14px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.foot b{color:#fff;letter-spacing:.18em}
.url{position:absolute;right:60px;bottom:26px;font:600 14px var(--f-mono);color:var(--muted)}

/* the "control desk": a screen tilted back, carrying the live diagram */
.stage{position:absolute;left:0;right:0;top:232px;height:330px;perspective:1500px;perspective-origin:50% 0%}
.screen{position:absolute;border-radius:14px;overflow:hidden;background:#f3f8fe;
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 0 8px rgba(255,255,255,.06),0 30px 60px rgba(0,0,0,.55),0 0 80px rgba(56,189,248,.35);
  transform-origin:50% 0%}
.screen iframe{border:0;display:block;transform-origin:0 0;background:#f3f8fe}
.screen .cap{position:absolute;left:14px;top:12px;z-index:2;font:700 13px var(--f-mono);letter-spacing:.12em;color:#fff;background:#0a2463;padding:5px 10px;border-radius:6px}
.glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 35%)}
.badge{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.96);color:#0a2463;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.badge i{width:12px;height:12px;border-radius:50%}
.badge b{font:800 26px/1 var(--f-display)}
.badge small{display:block;font:600 12px var(--f-mono);letter-spacing:.08em;color:#6a7fa4;margin-top:3px}
.hb{display:flex;gap:12px;padding-bottom:8px}
.hb .badge{position:static}
.flow{position:absolute;z-index:6;font:700 15px var(--f-mono);letter-spacing:.12em;color:#fff;background:rgba(10,36,99,.85);border:1px solid rgba(125,211,252,.6);padding:6px 12px;border-radius:999px}
</style>
</head>
<body>
<div class="grid"></div>
<div class="top">
  <div class="brand"><span class="logo"><svg width="30" height="30" viewBox="0 0 32 32"><path d="M5 25V8l11 10L27 8v17" fill="none" stroke="#0a2463" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/></svg></span><b>MAKOM</b><span id="eyebrow"></span></div>
  <div class="live"><i></i>CANLI SİMÜLASYON</div>
</div>
<div class="head"><h1 id="title"></h1><p class="tag" id="tag"></p></div>
<div class="stage" id="stage"></div>
<div class="foot">created by <b>GOTONOM</b></div>
<div class="url">makom-tunel-production.up.railway.app</div>
<div class="stripe"></div>
<script>
const V = {
  index:  { eyebrow:'TESİS KONTROL MERKEZİ', title:'Kontrol <span>Merkezi</span>', tag:'3 bunker, 4 tünel ve 20 üretim odası tek ekranda, kompostun bütün yolculuğu.' },
  bunker: { eyebrow:'FAZ 1 · BUNKER', title:'Faz 1 <span>Bunker</span>', tag:'Fan 5 dk çalışır, 25 dk durur; gerekirse 6–7 dk. 7 dk PLC sınırı.' },
  tunel:  { eyebrow:'FAZ 2 · TÜNEL', title:'Faz 2 <span>Tünel</span>', tag:'Pastörizasyon ve kondisyonlama: 7 etaplı tarif, otomatik geçiş.' },
  oda:    { eyebrow:'MANTAR ÜRETİMİ', title:'Üretim <span>Odaları</span>', tag:'20 oda: sıcaklık, nem, CO₂ ve taze hava, 52 günlük döngü.' },
};
const key = (location.hash || '#index').slice(1), v = V[key] || V.index;
document.getElementById('eyebrow').textContent = v.eyebrow;
document.getElementById('title').innerHTML = v.title;
document.getElementById('tag').textContent = v.tag;

// Show only the page's process diagram inside the frame.
const ONLY_MIMIC = `html,body{background:#f3f8fe!important;overflow:hidden!important}
  .wrap{padding:0!important;max-width:none!important;gap:0!important}
  .wrap>*:not(.mimic){display:none!important}
  .mimic{border:0!important;border-radius:0!important;box-shadow:none!important}
  .mimic-hint,.msens{display:none!important}
  *{animation-play-state:paused!important}`;
const FRAME_W = 1500;
function screen({src, x, y, w, rx = 16, ry = -6, z = 1, cap, prep}){
  const el = document.createElement('div');
  el.className = 'screen'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.zIndex = z;
  el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  const f = document.createElement('iframe');
  f.style.width = FRAME_W + 'px'; f.style.height = '700px';
  f.src = src;
  f.onload = () => {
    const d = f.contentDocument, st = d.createElement('style'); st.textContent = ONLY_MIMIC; d.head.append(st);
    if (prep) prep(d);
    setTimeout(() => {
      const m = d.querySelector('.mimic'), h = Math.ceil(m.getBoundingClientRect().height), k = w/FRAME_W;
      f.style.height = h + 'px'; f.style.transform = `scale(${k})`; el.style.height = Math.round(h*k) + 'px';
    }, 400);
  };
  el.append(f);
  if (cap){ const c = document.createElement('span'); c.className = 'cap'; c.textContent = cap; el.append(c); }
  const g = document.createElement('div'); g.className = 'glare'; el.append(g);
  document.getElementById('stage').append(el);
}
// Key figures sit in the header, right of the title, so nothing covers the diagram.
function badges(list){
  const box = document.createElement('div'); box.className = 'hb';
  box.innerHTML = list.map(([color, val, label]) => `<div class="badge"><i style="background:${color}"></i><div><b>${val}</b><small>${label}</small></div></div>`).join('');
  document.getElementById('tag').replaceWith(box);
}
function flow(x, y, t){ const f = document.createElement('div'); f.className = 'flow'; f.style.left = x + 'px'; f.style.top = y + 'px'; f.textContent = t; document.body.append(f); }
const click = (d, sel) => { const e = d.querySelector(sel); if (e) e.click(); };

if (key === 'bunker'){
  // slow the demo and run the fan by hand so the diagram shows air flowing through the pile
  screen({src:'/docs/bunker.html', x:60, y:6, w:1080, rx:18, ry:0, prep: d => {
    click(d, '#speedSeg [data-s="1"]');
    const m = d.getElementById('s-mode'); m.value = 'manual'; m.dispatchEvent(new Event('change'));
    click(d, '#manOn');
  }});
  badges([['#1b5fd9','5 / 25 dk','FAN ÇEVRİMİ'], ['#dc2626','7 dk','PLC SINIRI']]);
} else if (key === 'tunel'){
  screen({src:'/docs/tunel.html', x:60, y:6, w:1080, rx:18, ry:0});
  badges([['#f43f5e','58,5 °C','PASTÖRİZASYON'], ['#1b5fd9','18.000 m³/h','30 kW · 4.000 Pa']]);
} else if (key === 'oda'){
  screen({src:'/docs/oda.html', x:60, y:6, w:1080, rx:18, ry:0});
  badges([['#60a5fa','16,0 °C','PINNING · ODA 01'], ['#34d399','800 ppm','CO₂ HEDEFİ']]);
} else {
  // three phases cascading front to back, like screens on a control desk
  screen({src:'/docs/bunker.html', x:40,  y:0,   w:620, rx:14, ry:10,  z:1, cap:'FAZ 1 · BUNKER', prep: d => {
    click(d, '#speedSeg [data-s="1"]'); const m = d.getElementById('s-mode'); m.value = 'manual'; m.dispatchEvent(new Event('change')); click(d, '#manOn'); }});
  screen({src:'/docs/tunel.html',  x:300, y:62,  w:620, rx:14, ry:0,   z:2, cap:'FAZ 2 · TÜNEL'});
  screen({src:'/docs/oda.html',    x:560, y:124, w:620, rx:14, ry:-10, z:3, cap:'ÜRETİM · ODA'});
  flow(640, 254, 'FAZ 1 → FAZ 2');
  flow(900, 316, 'FAZ 2 → ODALAR');
}
</script>
</body>
</html>
